<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Image Manager - DnD Estrella</title>
</head>

<body>

    <!-- Контейнер Менеджера Картинок -->
    <div id="image-manager-container">

        <h2 class="manager-title">Modern Image Manager</h2>

        <!-- 🎯 ЗОНА DRAG AND DROP -->
        <div id="drop-zone">
            <input type="file" id="hidden-file-input" accept="image/*" style="display: none;" />

            <p class="drop-zone-text">
                Drag and Drop files here or click to select
            </p>
        </div>

        <!-- 🖼️ ПРЕВЬЮ ЗАГРУЖЕННЫХ КАРТИНОК (FOTO 6) -->
        <div id="images-preview-gallery"></div>

    </div>

</body>

</html>
