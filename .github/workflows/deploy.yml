name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: helpdesk/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: helpdesk/frontend
        run: npm install

      - name: Build Production HTML Assets
        working-directory: helpdesk/frontend
        run: npm run build

      - name: Deploy static bundle to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: helpdesk/frontend/dist
          branch: gh-pages
